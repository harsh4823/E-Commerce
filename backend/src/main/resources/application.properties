spring.application.name=E-Commerce

#spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
#spring.datasource.username=root
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

project.image=images

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=86400000
spring.app.jwtCookieName=springBootEcom

frontend.url = ${FRONTEND_URL:http://localhost:3000}
image.base.url = ${BACKEND_URL:http://localhost:8080}/images

logging.pattern.console = ${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

stripe.secret.key = ${STRIPE_SECRET_KEY}

razorpay.key.id = ${RAZORPAY_TEST_ID}

razorpay.key.secret= ${RAZORPAY_KEY_SECRET}

cloudinary.api.name = ${CLOUDINARY_NAME}
cloudinary.api.key = ${CLOUDINARY_API_KEY}
cloudinary.api.secret = ${CLOUDINARY_API_SECRET}